name: CI - GoDotTest
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: stable
  DOTNET_VERSION: 10.0.401
  PROJECT_PATH: .
jobs:
  test:
    name: Run GoDotTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj',
            '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Cache Godot Binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /tmp/godot
          key: godot-mono-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}
      - name: Download Godot .NET (Mono)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: >
          mkdir -p /tmp/godot
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_linux_x86_64.zip"
          wget -q "$URL" -O /tmp/godot/godot.zip
          unzip -q /tmp/godot/godot.zip -d /tmp/godot
          rm /tmp/godot/godot.zip
          mv /tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_linux_x86_64 /tmp/godot/bin
          chmod +x /tmp/godot/bin/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_linux.x86_64
      - name: Symlink Godot to PATH
        run: >
          sudo ln -s
          /tmp/godot/bin/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_linux.x86_64
          /usr/local/bin/godot
          echo "GODOT=/usr/local/bin/godot" >> $GITHUB_ENV
      - name: Restore and Build C# Project
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          dotnet restore
          dotnet build --configuration Debug --no-restore
      - name: Import Godot Project Assets
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          # Generates the .godot cache needed before running scenes headlessly
          godot --headless --import --quit || true
      - name: Execute GoDotTest Suite
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          godot --headless --run-tests --quit-on-finish
